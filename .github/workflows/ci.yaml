name: InfraAudit
on:
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: CI
    strategy:
      matrix:
        go-version: [ 1.20.x, 1.21.x, 1.22.x ]
        os: [ ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - name: install go
        uses: actions/setup-go@v3
        with:
          go-version: ${{ matrix.go-version }}
      - uses: actions/checkout@v2

      - name: lint with golangci-lint
        uses: golangci/golangci-lint-action@v2

      - name: Install dependencies
        run: make deps

      - name: Run go fmt
        run: make fmt

      - name: Run go vet
        run: make vet

      - name: Run go test
        run: make test
  